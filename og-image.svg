  <text x="258" y="113" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#6B7280">AI-NATIVE ITSM</text>
  <text x="258" y="127" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#C9C7BF">ANDREAS NYBERG</text>
  <text x="258" y="141" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#6B7280">ARCHITECT  ·  SME</text>

