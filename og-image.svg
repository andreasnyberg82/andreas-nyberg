        font-family="DejaVu Serif, Georgia, Times New Roman, serif"
        font-size="52" font-weight="bold" font-style="italic" fill="#E8872A">actually deploy</text>

  <!-- line 3: monospace bold + orange cursor block -->
  <text x="248" y="374"
        font-family="DejaVu Sans Mono, Courier New, monospace"
        font-size="52" font-weight="bold" fill="#E8E4D8">in a week,</text>
  <!-- cursor: DejaVu Sans Mono at 52px → char width ≈ 31.2px; "in a week," = 10 chars = 312px -->
  <rect x="560" y="332" width="20" height="48" fill="#E8872A"/>

  <!-- SUBTITLE comment lines -->
  <text x="248" y="438"
        font-family="DejaVu Sans Mono, Courier New, monospace"
        font-size="13" fill="#374151">// AI-native ITSM architect · 15 years in enterprise service management</text>
  <text x="248" y="456"
        font-family="DejaVu Sans Mono, Courier New, monospace"
        font-size="13" fill="#374151">// JSM · Assets · CMDB · Forge · multi-agent delivery · London</text>

  <!-- BOTTOM STATUS BAR -->
  <rect x="0" y="596" width="1200" height="34" fill="#0E0F10"/>
  <line x1="0" y1="596" x2="1200" y2="596" stroke="#252527" stroke-width="1"/>
  <circle cx="230" cy="613" r="4" fill="#22C55E"/>
  <text x="240" y="618" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="11" fill="#22C55E">main</text>
  <text x="278" y="618" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="11" fill="#4B5563"> · utf-8 · 1f</text>
  <text x="600" y="618" text-anchor="middle"
